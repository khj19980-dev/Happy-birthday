<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday! 🎂</title>
    <style>
        body { 
            font-family: 'Pretendard', sans-serif; 
            background-color: #fff0f5; 
            text-align: center; 
            margin: 0;
            padding: 0;
            overflow-x: hidden; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- 스토리 인트로 오버레이 --- */
        #story-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #fff0f5;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 1.5s ease-in-out;
        }
        
        .scene {
            position: absolute;
            width: 90%;
            max-width: 450px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease-in-out;
            pointer-events: none;
        }
        
        .scene.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* 어릴 적 사진 크기 */
        .scene img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 50%;
            border: 6px solid white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin: 0 10px;
        }

        .scene p {
            color: #d63384;
            font-size: 1.3em;
            line-height: 1.6;
            margin-top: 30px;
            font-weight: bold;
            word-break: keep-all;
        }

        .photo-row {
            display: flex;
            justify-content: center;
        }

        /* 커플 사진 크기 */
        .couple-img {
            width: 300px !important;
            height: 300px !important;
            border-radius: 20px !important;
        }

        /* --- 배경 둥둥 사진들 (크기 대폭 확대) --- */
        .floating-img {
            position: absolute;
            border: 5px solid white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            z-index: -1; 
            animation: float 8s infinite ease-in-out alternate;
            object-fit: cover;
        }
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-30px) rotate(10deg); }
        }
        
        .img1 { top: 5%; left: 2%; width: 220px; height: 220px; animation-duration: 9s; transform: rotate(-5deg); }
        .img2 { top: 8%; right: 2%; width: 200px; height: 260px; animation-duration: 11s; animation-delay: 1s; transform: rotate(15deg); }
        .img3 { bottom: 8%; left: 3%; width: 230px; height: 180px; animation-duration: 13s; animation-delay: 2s; transform: rotate(5deg); }
        .img4 { bottom: 5%; right: 3%; width: 220px; height: 220px; animation-duration: 10s; animation-delay: 0.5s; transform: rotate(-10deg); }
        .img5 { top: 40%; left: -3%; width: 170px; height: 170px; animation-duration: 12s; animation-delay: 1.5s; }
        .img6 { top: 45%; right: -3%; width: 180px; height: 180px; animation-duration: 14s; animation-delay: 2.5s; }

        .container { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 35px; 
            border-radius: 15px; 
            box-shadow: 0 8px 25px rgba(214, 51, 132, 0.2); 
            max-width: 420px; 
            width: 85%;
            margin: auto; 
            z-index: 10;
        }
        .main-title { color: #d63384; font-size: 1.9em; margin-bottom: 30px; word-break: keep-all; line-height: 1.4; }
        .pre-message { color: #555; font-size: 1.1em; margin-bottom: 20px; line-height: 1.6; word-break: keep-all; font-weight: bold; }
        input { padding: 14px; width: 100%; margin: 15px 0; border: 2px solid #ffb6c1; border-radius: 8px; font-size: 1.05em; box-sizing: border-box; outline: none; }
        input:focus { border-color: #d63384; }
        button { background-color: #d63384; color: white; border: none; padding: 15px 25px; border-radius: 8px; font-size: 1.1em; cursor: pointer; font-weight: bold; width: 100%; box-sizing: border-box; margin-top: 10px; transition: 0.3s; }
        button:hover { background-color: #c82373; transform: scale(1.02); }
        #next-btn, #show-question-btn { background-color: #ff9fb8; }
        #next-btn:hover, #show-question-btn:hover { background-color: #ff7597; }
        .success-text { color: #d63384; font-weight: bold; margin-top: 15px; line-height: 1.5; font-size: 1.1em; }
        .fail-text { color: #ff4d4d; font-weight: bold; margin-top: 15px; line-height: 1.5; font-size: 1.1em; }
        .highlight { color: #d63384; font-size: 1.4em; font-weight: bold; display: block; margin: 20px 0; background: #fff0f5; padding: 15px; border-radius: 8px; }
    </style>
    
    <script>
        // 마법의 확장자 자동 탐색 코드
        function fallbackImage(img) {
            const basename = img.getAttribute('data-basename');
            if (!img.dataset.triedJpeg) {
                img.dataset.triedJpeg = "true";
                img.src = basename + '.jpeg';
            } else if (!img.dataset.triedPng) {
                img.dataset.triedPng = "true";
                img.src = basename + '.png';
            } else if (!img.dataset.triedJPG) {
                img.dataset.triedJPG = "true";
                img.src = basename + '.JPG';
            } else if (!img.dataset.triedPNG) {
                img.dataset.triedPNG = "true";
                img.src = basename + '.PNG';
            } else {
                img.src = 'https://via.placeholder.com/200/ffb6c1/ffffff?text=Photo';
            }
        }
    </script>
</head>
<body>

    <!-- 영화 같은 스토리 인트로 -->
    <div id="story-overlay">
        <!-- 장면 1: 어릴 적 사진 -->
        <div class="scene" id="scene1">
            <div class="photo-row">
                <img src="child_boy.jpg" data-basename="child_boy" alt="어릴적 남친" onerror="fallbackImage(this)">
                <img src="child_girl.jpg" data-basename="child_girl" alt="어릴적 여친" onerror="fallbackImage(this)">
            </div>
            <p>이 귀엽고 깜찍한 두 아이는 자라서<br>서로를 만나고 연애를 하게 됩니다.</p>
        </div>

        <!-- 장면 2: 커플 사진 -->
        <div class="scene" id="scene2">
            <div class="photo-row">
                <img src="couple.jpg" data-basename="couple" alt="커플 사진" class="couple-img" onerror="fallbackImage(this)">
            </div>
            <p>이렇게 이쁜 커플이 되어<br>서로에게 행복이 되어줍니다.</p>
        </div>

        <!-- 장면 3: 마지막 멘트 -->
        <div class="scene" id="scene3">
            <p style="font-size: 1.5em; line-height: 1.8;">이 페이지는<br>여자친구인 김현수 양을<br>세상에서 가장 사랑하는 남자친구<br>김현진 씨가 만든<br>오직 현수만을 위한 페이지입니다.</p>
        </div>
    </div>

    <!-- 배경 둥둥 사진들 -->
    <div id="floating-images" style="display: none;">
        <img src="photo1.jpg" data-basename="photo1" class="floating-img img1" onerror="fallbackImage(this)">
        <img src="photo2.jpg" data-basename="photo2" class="floating-img img2" onerror="fallbackImage(this)">
        <img src="photo3.jpg" data-basename="photo3" class="floating-img img3" onerror="fallbackImage(this)">
        <img src="photo4.jpg" data-basename="photo4" class="floating-img img4" onerror="fallbackImage(this)">
        <img src="photo5.jpg" data-basename="photo5" class="floating-img img5" onerror="fallbackImage(this)">
        <img src="photo6.jpg" data-basename="photo6" class="floating-img img6" onerror="fallbackImage(this)">
    </div>

    <!-- 메인 컨텐츠 영역 (시작 화면) -->
    <div id="main-content" style="display: none; width: 100%;">
        <div id="intro-section" class="container">
            <h1 class="main-title">현수 생일 선물을 찾아 떠나는 여정</h1>
            <button onclick="startGame()">시작하기</button>
        </div>

        <div id="pre-message-section" class="container" style="display: none;">
            <h1 style="color: #d63384; font-size: 1.2em;">💌 메시지 도착</h1>
            <p id="pre-message-text" class="pre-message"></p>
            <button id="show-question-btn" onclick="showQuestion()">문제 보기 ➔</button>
        </div>

        <div id="quiz-section" class="container" style="display: none;">
            <p id="question" style="font-weight: bold; font-size: 1.1em; word-break: keep-all; line-height: 1.5;"></p>
            <input type="text" id="answer" placeholder="정답을 입력해 주세요">
            <button id="submit-btn" onclick="checkAnswer()">정답 확인</button>
            <button id="next-btn" onclick="nextQuestion()" style="display: none;">다음으로 ➔</button>
            <p id="feedback"></p>
        </div>

        <div id="result-section" class="container" style="display: none;">
            <h2>🎉 축하해! 모든 퀴즈 통과! 🎉</h2>
            <p id="final-message" style="font-weight: bold; font-size: 1.1em; color: #555; line-height: 1.5;"></p>
            <span class="highlight">🎁 다음 장소:<br>화장실 수납장 🎁</span>
            <p style="font-weight: bold;">얼른 가서 선물을 확인해 보세요! ❤️</p>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const scene1 = document.getElementById('scene1');
            const scene2 = document.getElementById('scene2');
            const scene3 = document.getElementById('scene3');
            const overlay = document.getElementById('story-overlay');
            const mainContent = document.getElementById('main-content');
            const floatingImages = document.getElementById('floating-images');

            setTimeout(() => { scene1.classList.add('active'); }, 500);
            
            setTimeout(() => { 
                scene1.classList.remove('active'); 
                setTimeout(() => { scene2.classList.add('active'); }, 1000);
            }, 4500);

            setTimeout(() => { 
                scene2.classList.remove('active'); 
                setTimeout(() => { scene3.classList.add('active'); }, 1000);
            }, 9000);

            setTimeout(() => { 
                scene3.classList.remove('active'); 
                overlay.style.opacity = '0';
                
                setTimeout(() => {
                    overlay.style.display = 'none';
                    mainContent.style.display = 'block';
                    floatingImages.style.display = 'block';
                }, 1500); 
            }, 14000); 
        });

        const quizzes = [
            { 
                preMsg: "화장 정리대가 선물이라고 생각하고 실망했을 현수씨!! 퀴즈를 풀고 선물을 찾아보세요~! 첫 번째 문제는 아주 쉬운 문제로 시작 됩니다!",
                q: "우리의 행복한 여정이 시작된 날짜는~~?? (00년 00월 00일)", 
                a: ["26년10월25일", "2026년10월25일"],
                successMsg: "맞습니다 우리의 행복한 여정은 그날로부터 시작됐습니다~♥",
                failMsg: "앗, 다시 한 번 생각해 볼까?"
            },
            { 
                preMsg: "예상대로 첫 번째 문제는 잘 통과하셨군요 그럼 두 번째 문제 갑니다~",
                q: "현수와 현진이가 처음으로 비행기를 타고 떠났던 여행은~~?", 
                a: ["제주도", "제주"],
                successMsg: "역시 잊지못할 우리의 첫 여행을 기억하고 계시군요. 그럼 다음 문제로~",
                failMsg: "이걸 기억하지 못하다니 실망인걸요.. 하지만 기회를 드리겠습니다. 다시 도전하세요"
            },
            { 
                preMsg: "여기까지는 쉬웠죠?? 이제부턴 난이도가 좀 상승합니다.",
                q: "현수가 해주는 집요리 중에 현진이가 가장 좋아하는 음식은~~??", 
                a: ["오들막", "오이들기름막국수", "오이들기름막국수!"], 
                successMsg: "역시 현수는 현잘알이네요~ 그럼 마지막 문제로 가볼까요~?",
                failMsg: "아쉽지만 오답입니다. 다시 한번 생각해보세요... 오이...?"
            },
            { 
                preMsg: "여기까지 오시느라 정말 고생 많으셨습니다. 이제 마지막 문제를 풀고 선물을 획득하세요!",
                q: "정말 현진이가 사랑하고 평생 함께하고 싶고 세상에서 가장 아름답고 세상에서 가장 행복한 여자로 만들어주고 싶은 여자의 이름은~~??", 
                a: ["김현수", "현수"],
                successMsg: "정답입니다! 모든 문제를 해결한 사랑하는 현수씨! 다음 장소로 이동해서 선물을 수령하세요~!",
                failMsg: "이걸 못 맞추다니 정말 실망인걸요? 다시 도전하세요...ㅡ.ㅡ"
            }
        ];
        
        let current = 0;

        function startGame() {
            document.getElementById('intro-section').style.display = 'none';
            showPreMessage();
        }

        function showPreMessage() {
            document.getElementById('quiz-section').style.display = 'none';
            document.getElementById('pre-message-section').style.display = 'block';
            document.getElementById('pre-message-text').innerText = quizzes[current].preMsg;
        }

        function showQuestion() {
            document.getElementById('pre-message-section').style.display = 'none';
            document.getElementById('quiz-section').style.display = 'block';
            document.getElementById('question').innerText = `Q${current + 1}. ${quizzes[current].q}`;
            document.getElementById('answer').value = '';
            document.getElementById('answer').style.display = 'inline-block';
            document.getElementById('submit-btn').style.display = 'inline-block';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('feedback').innerText = '';
            document.getElementById('feedback').className = '';
        }

        function checkAnswer() {
            const userAnswer = document.getElementById('answer').value.replace(/\s+/g, '').toLowerCase();
            let isCorrect = false;

            for (let i = 0; i < quizzes[current].a.length; i++) {
                let correctAnswer = quizzes[current].a[i].replace(/\s+/g, '').toLowerCase();
                if (userAnswer === correctAnswer) {
                    isCorrect = true;
                    break;
                }
            }

            if (isCorrect) {
                if (current === quizzes.length - 1) {
                    document.getElementById('quiz-section').style.display = 'none';
                    document.getElementById('result-section').style.display = 'block';
                    document.getElementById('final-message').innerText = quizzes[current].successMsg;
                } else {
                    document.getElementById('feedback').innerText = quizzes[current].successMsg;
                    document.getElementById('feedback').className = 'success-text';
                    document.getElementById('answer').style.display = 'none';
                    document.getElementById('submit-btn').style.display = 'none';
                    document.getElementById('next-btn').style.display = 'inline-block';
                }
            } else {
                document.getElementById('feedback').innerText = quizzes[current].failMsg;
                document.getElementById('feedback').className = 'fail-text';
            }
        }

        function nextQuestion() {
            current++;
            showPreMessage();
        }
    </script>
</body>
</html>
